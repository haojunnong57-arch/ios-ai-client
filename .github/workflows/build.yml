name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned IPA (robust)
        run: |
          set -e
          # Archive without signing
          xcodebuild archive \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -configuration Release \
            -archivePath build/AIAggregate.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_NAME=AIAggregate

          APP_PATH="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist CFBundleExecutable ==="
          plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist" || true
          # Ensure executable key exists (fallback)
          if ! plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "Injecting CFBundleExecutable"
            plutil -insert CFBundleExecutable -string AIAggregate "$APP_PATH/Info.plist"
          fi
          # Make sure binary is executable
          chmod +x "$APP_PATH/AIAggregate" || true

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r AIAggregate-unsigned.ipa Payload
          ls -lh AIAggregate-unsigned.ipa
          # Verify structure
          unzip -l AIAggregate-unsigned.ipa | head -20

      - name: Upload IPA (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA to Release (ci-unsigned-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete "ci-unsigned-latest" -y --cleanup-tag || true
          gh release create "ci-unsigned-latest" \
            --title "Unsigned build $(date -u +%Y%m%d-%H%M%S)" \
            --prerelease \
            --notes "修复 CFBundleExecutable，支持全能签导入。黑白高级图标后续补全。未签名 IPA，请用全能签重签安装。" \
            build/AIAggregate-unsigned.ipa

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v2.1.1"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" \
            --title "2.1.1 修复导入 + 局域网权限" \
            --prerelease \
            --notes "修复全能签「主可执行文件不可用」问题（补充 CFBundleExecutable）。已声明本地网络权限。支持局域网 7B 模型。未签名，需重签后安装。" \
            build/AIAggregate-unsigned.ipa
