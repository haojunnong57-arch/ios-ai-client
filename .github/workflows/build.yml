name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -project AIAggregate.xcodeproj -list

      - name: Build for Simulator
        run: |
          set +e
          xcodebuild build \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          echo "BUILD_EXIT=$?"
          tail -60 build.log
          exit 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
