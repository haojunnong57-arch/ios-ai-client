name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode || true
          if [ -d /Applications/Xcode_16.app ]; then sudo xcode-select -s /Applications/Xcode_16.app; elif [ -d /Applications/Xcode.app ]; then sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Create minimal AppIcon
        run: |
          mkdir -p AIAggregate/Assets.xcassets/AppIcon.appiconset
          echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > AIAggregate/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{"info":{"author":"xcode","version":1}}' > AIAggregate/Assets.xcassets/Contents.json
          ls -la AIAggregate/Assets.xcassets/

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          set -e
          xcodebuild archive -project AIAggregate.xcodeproj -scheme AIAggregate -configuration Release -archivePath build/AIAggregate.xcarchive -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" PRODUCT_NAME=AIAggregate
          APP="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable AIAggregate" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string AIAggregate" "$APP/Info.plist"
          chmod +x "$APP/AIAggregate" || true
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/
          cd build
          zip -r -X AIAggregate-unsigned.ipa Payload
          ls -lh AIAggregate-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa
          if-no-files-found: error

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete ci-unsigned-latest -y --cleanup-tag || true
          gh release create ci-unsigned-latest --title "Unsigned $(date -u +%Y%m%d-%H%M%S)" --prerelease --notes "Minimal valid build. Use 全能签 to resign." build/AIAggregate-unsigned.ipa
          gh release delete v2.2.0 -y --cleanup-tag || true
          gh release create v2.2.0 --title "2.2.0" --prerelease --notes "Build with icon assets and network permissions." build/AIAggregate-unsigned.ipa
