name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned IPA
        run: |
          set -e
          xcodebuild archive \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -configuration Release \
            -archivePath build/AIAggregate.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          APP_PATH="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r AIAggregate-unsigned.ipa Payload
          ls -lh AIAggregate-unsigned.ipa

      - name: Upload IPA (Actions artifact, 30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA to Release (stable latest link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete "ci-unsigned-latest" -y --cleanup-tag || true
          gh release create "ci-unsigned-latest" \
            --title "Unsigned build $(date -u +%Y%m%d-%H%M%S)" \
            --prerelease \
            --notes "GitHub Actions 自动构建的未签名 IPA。未签名、不可直接安装，请用全能签等工具重签后使用。" \
            build/AIAggregate-unsigned.ipa

      - name: Publish v2.0 unsigned IPA (versioned stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete "v2.0" -y --cleanup-tag || true
          gh release create "v2.0" \
            --title "2.0.0 未签名构建" \
            --prerelease \
            --notes "2.0：API Key 状态校验与空会话引导、界面按 iPhone 高屏比例自适应。未签名 IPA，需全能签重签后使用。" \
            build/AIAggregate-unsigned.ipa
