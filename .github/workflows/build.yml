name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create AppIcon (black-white advanced)
        run: |
          set -e
          mkdir -p AIAggregate/Assets.xcassets/AppIcon.appiconset
          # Generate a clean black & white geometric icon using sips + pure data
          # Create 1024 base with Python (always available)
          python3 << 'PY'
          from struct import pack
          import zlib, os
          # Minimal valid PNG 1024x1024 solid black with white circle (very simple for size)
          def png_chunk(tag, data):
              return pack(">I", len(data)) + tag + data + pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          w = h = 1024
          raw = b""
          for y in range(h):
              raw += b"\x00"  # filter
              for x in range(w):
                  # black bg, white ring
                  dx, dy = x - 512, y - 512
                  r2 = dx*dx + dy*dy
                  if 180*180 < r2 < 220*220 or 300*300 < r2 < 340*340 or r2 < 60*60:
                      raw += b"\xff\xff\xff"
                  else:
                      raw += b"\x0a\x0a\x0a"
          ihdr = pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
          data = b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", ihdr) + png_chunk(b"IDAT", zlib.compress(raw, 9)) + png_chunk(b"IEND", b"")
          open("/tmp/icon1024.png", "wb").write(data)
          print("icon1024.png size", os.path.getsize("/tmp/icon1024.png"))
          PY
          # Resize with sips (native macOS)
          for size in 20 29 40 60 76 83.5 1024; do
            sips -z ${size%.*} ${size%.*} /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-${size}.png 2>/dev/null || \
            sips -z $size $size /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-${size}.png
          done
          # Also @2x @3x approximations
          sips -z 40 40 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-20@2x.png
          sips -z 60 60 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-20@3x.png
          sips -z 58 58 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-29@2x.png
          sips -z 87 87 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-29@3x.png
          sips -z 80 80 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-40@2x.png
          sips -z 120 120 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-40@3x.png
          sips -z 120 120 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-60@2x.png
          sips -z 180 180 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-60@3x.png
          sips -z 152 152 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-76@2x.png
          sips -z 167 167 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-83.5@2x.png
          sips -z 1024 1024 /tmp/icon1024.png --out AIAggregate/Assets.xcassets/AppIcon.appiconset/icon-1024.png

          cat > AIAggregate/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
{
  "images" : [
    {"filename" : "icon-20.png", "idiom" : "iphone", "scale" : "1x", "size" : "20x20"},
    {"filename" : "icon-20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20"},
    {"filename" : "icon-20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20"},
    {"filename" : "icon-29.png", "idiom" : "iphone", "scale" : "1x", "size" : "29x29"},
    {"filename" : "icon-29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29"},
    {"filename" : "icon-29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29"},
    {"filename" : "icon-40.png", "idiom" : "iphone", "scale" : "1x", "size" : "40x40"},
    {"filename" : "icon-40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40"},
    {"filename" : "icon-40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40"},
    {"filename" : "icon-60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60"},
    {"filename" : "icon-60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60"},
    {"filename" : "icon-76.png", "idiom" : "ipad", "scale" : "1x", "size" : "76x76"},
    {"filename" : "icon-76@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "76x76"},
    {"filename" : "icon-83.5@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5"},
    {"filename" : "icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024"}
  ],
  "info" : {"author" : "xcode", "version" : 1}
}
EOF
          cat > AIAggregate/Assets.xcassets/Contents.json << 'EOF'
{
  "info" : {"author" : "xcode", "version" : 1}
}
EOF
          ls -la AIAggregate/Assets.xcassets/AppIcon.appiconset/ | head -20

      - name: Generate project
        run: xcodegen generate

      - name: Build for Simulator (smoke test)
        run: |
          xcodebuild build \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Archive & package robust unsigned IPA
        run: |
          set -e
          xcodebuild archive \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -configuration Release \
            -archivePath build/AIAggregate.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_NAME=AIAggregate \
            | xcpretty || true

          APP="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          echo "=== App structure ==="
          find "$APP" -maxdepth 2 -type f | head -30
          ls -la "$APP"

          # Force CFBundleExecutable
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable AIAggregate" "$APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string AIAggregate" "$APP/Info.plist"

          # Ensure binary executable
          chmod +x "$APP/AIAggregate"

          # Clean package
          rm -rf build/Payload build/AIAggregate-unsigned.ipa
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/

          # Critical for many Chinese signing tools: use ditto or zip with no extra attrs
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload AIAggregate-unsigned.ipa 2>/dev/null || \
          zip -r -X AIAggregate-unsigned.ipa Payload

          ls -lh AIAggregate-unsigned.ipa
          echo "=== IPA content ==="
          unzip -l AIAggregate-unsigned.ipa | head -25

          # Final verification
          python3 -c '
import zipfile, plistlib, os, tempfile, shutil
z = zipfile.ZipFile("AIAggregate-unsigned.ipa")
assert any(n.endswith(".app/AIAggregate") for n in z.namelist()), "missing binary"
with tempfile.TemporaryDirectory() as d:
  z.extractall(d)
  app = os.path.join(d, "Payload", "AIAggregate.app")
  assert os.path.isfile(os.path.join(app, "AIAggregate"))
  p = plistlib.load(open(os.path.join(app, "Info.plist"), "rb"))
  assert p.get("CFBundleExecutable") == "AIAggregate", p
  print("VERIFY OK: CFBundleExecutable =", p["CFBundleExecutable"])
  print("Binary size:", os.path.getsize(os.path.join(app, "AIAggregate")))
  print("Has Assets.car or icons:", any("Assets" in f or "icon" in f.lower() for f in os.listdir(app)))
'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for TAG in ci-unsigned-latest v2.1.2; do
            gh release delete "$TAG" -y --cleanup-tag || true
          done
          gh release create "ci-unsigned-latest" \
            --title "Unsigned $(date -u +%Y%m%d-%H%M%S)" \
            --prerelease \
            --notes "修复全能签导入失败。已降低部署目标到 iOS 18、强制 CFBundleExecutable、生成黑白高级图标、使用 ditto/zip -X 标准打包。请下载后用全能签重签安装。" \
            build/AIAggregate-unsigned.ipa
          gh release create "v2.1.2" \
            --title "2.1.2 全能签兼容修复 + 黑白图标" \
            --prerelease \
            --notes "针对「主可执行文件不可用」做了完整修复。" \
            build/AIAggregate-unsigned.ipa
