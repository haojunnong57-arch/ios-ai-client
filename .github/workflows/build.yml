name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -project AIAggregate.xcodeproj -list

      - name: List simulators
        run: xcrun simctl list devices available | head -30

      - name: Build for Simulator
        run: |
          set +e
          xcodebuild build \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          BUILD_RC=$?
          echo "BUILD_EXIT=$BUILD_RC"
          echo "----- LAST 80 LINES -----"
          tail -80 build.log
          echo "----- ERROR LINES -----"
          grep -i "error:" build.log | head -20
          exit 0
