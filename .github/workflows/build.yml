name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen || true

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -configuration Release \
            -archivePath build/AIAggregate.xcarchive \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_NAME=AIAggregate

      - name: Package IPA
        run: |
          APP="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          ls -la "$APP" || exit 1
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable AIAggregate" "$APP/Info.plist" 2>/dev/null || true
          chmod +x "$APP/AIAggregate" || true
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/
          cd build
          zip -r -X AIAggregate-unsigned.ipa Payload
          ls -lh AIAggregate-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ci-unsigned-latest -y --cleanup-tag || true
          gh release create ci-unsigned-latest --title "build $(date -u +%Y%m%d-%H%M%S)" --prerelease --notes "unsigned IPA" build/AIAggregate-unsigned.ipa
