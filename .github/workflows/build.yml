name: Build & Test iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator (debug)
        run: |
          xcodebuild build \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build Unsigned IPA (Release)
        run: |
          set -e
          xcodebuild archive \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -configuration Release \
            -archivePath build/AIAggregate.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcbeautify --renderer github-actions

          APP_PATH="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r AIAggregate-unsigned.zip Payload
          mv AIAggregate-unsigned.zip AIAggregate-unsigned.ipa
          ls -lh AIAggregate-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
