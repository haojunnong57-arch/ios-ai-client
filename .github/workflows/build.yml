name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync v2.9.0 source
        run: |
          curl -fL --retry 3 -o /tmp/src.zip "https://aka.doubaocdn.com/s/4e0QA6yaZo"
          unzip -q -o /tmp/src.zip -d /tmp/srcpkg
          cp -a /tmp/srcpkg/src/. ./
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "source already up to date"
          else
            git commit -m "sync v2.9.0 source (AI avatar + liquid glass + Instagram skin)"
            git push origin HEAD:main || true
          fi
          grep -n "MARKETING_VERSION" project.yml
          ls AIAggregate/SharedUI

      - name: Install tools
        run: brew install xcodegen || true

      - name: Generate project
        run: xcodegen generate

      - name: List sources
        run: find AIAggregate -name "*.swift" | sort

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AIAggregate.xcodeproj \
            -scheme AIAggregate \
            -configuration Release \
            -archivePath build/AIAggregate.xcarchive \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_NAME=AIAggregate \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors if failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==== ERROR LINES ===="
          grep -n "error:" build.log | head -80 > errors.txt || true
          tail -30 build.log >> errors.txt || true
          cat errors.txt || true
          gh release delete ci-build-log -y --cleanup-tag || true
          gh release create ci-build-log --prerelease --title "build log" --notes-file errors.txt || true

      - name: Package IPA
        run: |
          APP="build/AIAggregate.xcarchive/Products/Applications/AIAggregate.app"
          ls -la "$APP" || exit 1
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable AIAggregate" "$APP/Info.plist" 2>/dev/null || true
          chmod +x "$APP/AIAggregate" || true
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/
          cd build
          zip -r -X AIAggregate-unsigned.ipa Payload
          ls -lh AIAggregate-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAggregate-unsigned-ipa
          path: build/AIAggregate-unsigned.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ci-unsigned-latest -y --cleanup-tag || true
          gh release create ci-unsigned-latest --title "build $(date -u +%Y%m%d-%H%M%S)" --prerelease --notes "v2.9.0 AI 头像 + 液态玻璃 + Instagram 皮肤" build/AIAggregate-unsigned.ipa
          gh release delete v2.9.0 -y --cleanup-tag || true
          gh release create v2.9.0 --title "2.9.0 AI Avatar + Liquid Glass + Instagram Skin" --notes "AI 头像（用户侧不显示）+ iOS 26 原生 Liquid Glass + 无接缝 Instagram 皮肤 + 对话设定入口" build/AIAggregate-unsigned.ipa
