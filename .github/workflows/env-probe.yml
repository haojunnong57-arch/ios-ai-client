name: Env Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/env-probe.yml'

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Collect env and write to Step Summary
        run: |
          {
            echo "# macOS Runner 环境探测结果"
            echo ""
            echo "## 系统"
            echo "- OS: $(sw_vers -productName) $(sw_vers -productVersion)"
            echo "- Build: $(sw_vers -buildVersion)"
            echo "- Arch: $(uname -m)"
            echo "- CPU cores: $(sysctl -n hw.ncpu)"
            echo "- RAM: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"
            echo "- Disk: $(df -h / | tail -1 | awk '{print $4" free of "$2}')"
            echo ""
            echo "## Xcode"
            xcodebuild -version 2>&1 | sed 's/^/- /'
            echo "- xcode-select path: $(xcode-select -p)"
            echo "- /Applications Xcode apps:"
            ls /Applications | grep -i xcode | sed 's/^/  - /'
            echo ""
            echo "## Swift"
            swift --version 2>&1 | head -3 | sed 's/^/- /'
            echo ""
            echo "## iOS SDK"
            xcodebuild -showsdks 2>&1 | grep -i ios | sed 's/^/- /'
            echo ""
            echo "## Available iPhone Simulators"
            xcrun simctl list devices available 2>&1 | grep -i iPhone | head -8 | sed 's/^/- /'
            echo ""
            echo "## Code Signing Identities"
            if IDs=$(security find-identity -v -p codesigning 2>&1); then
              echo "$IDs" | sed 's/^/- /'
            else
              echo "- 无签名身份（符合预期：云端 runner 无 Apple ID 登录，无法做 Personal Team 签名）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
