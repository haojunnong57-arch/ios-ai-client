name: AIAggregate

options:
  bundleIdPrefix: com.haojunnong

targets:
  AIAggregate:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - AIAggregate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

  AIAggregateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - AIAggregateTests
    dependencies:
      - target: AIAggregate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichatTests
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  AIAggregate:
    build:
      targets:
        AIAggregate: all
    test:
      targets:
        - AIAggregateTests
