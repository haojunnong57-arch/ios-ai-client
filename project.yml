name: AIAggregate

options:
  bundleIdPrefix: com.haojunnong
  deploymentTarget:
    iOS: "26.0"

targets:
  AIAggregate:
    type: application
    platform: iOS
    sources:
      - path: AIAggregate
    deploymentTarget: "26.0"
    info:
      path: AIAggregate/App/Info.plist
      properties:
        CFBundleDisplayName: AI助手
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: [:]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat
        TARGETED_DEVICE_FAMILY: "1,2"

  AIAggregateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIAggregateTests
    dependencies:
      - target: AIAggregate
    deploymentTarget: "26.0"
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichatTests
