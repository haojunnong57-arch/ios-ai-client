name: AIAggregate

options:
  bundleIdPrefix: com.haojunnong
  deploymentTarget:
    iOS: "26.0"

targets:
  AIAggregate:
    type: application
    platform: iOS
    sources:
      - path: AIAggregate
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

  AIAggregateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIAggregateTests
    dependencies:
      - target: AIAggregate
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichatTests
