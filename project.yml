name: AIAggregate
options:
  bundleIdPrefix: com.haojunnong
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AIAggregate:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AIAggregate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat
        INFOPLIST_FILE: AIAggregate/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "2.1.2"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: AIAggregate
        EXECUTABLE_NAME: AIAggregate
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

  AIAggregateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AIAggregateTests
    dependencies:
      - target: AIAggregate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat.tests

schemes:
  AIAggregate:
    build:
      targets:
        AIAggregate: all
    test:
      targets:
        - AIAggregateTests
      gatherCoverageData: false
