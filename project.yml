name: AIAggregate
options:
  bundleIdPrefix: com.haojunnong
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  AIAggregate:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AIAggregate
    info:
      path: AIAggregate/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat
        INFOPLIST_FILE: AIAggregate/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  AIAggregateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AIAggregateTests
    dependencies:
      - target: AIAggregate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.aichat.tests

schemes:
  AIAggregate:
    build:
      targets:
        AIAggregate: all
    test:
      targets:
        - AIAggregateTests
      gatherCoverageData: false
